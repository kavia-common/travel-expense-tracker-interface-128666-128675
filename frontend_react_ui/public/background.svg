<?xml version="1.0" encoding="UTF-8"?>
<!-- Soft abstract gradient mesh style background for a subtle travel vibe -->
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7f9fc"/>
    </linearGradient>

    <radialGradient id="yGlow" cx="18%" cy="8%" r="60%">
      <stop offset="0%" stop-color="#FFD600" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#FFD600" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFD600" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bGlow" cx="82%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="gGlow" cx="12%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#22C55E" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="pGlow" cx="92%" cy="86%" r="48%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#F43F5E" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>

    <!-- Fine grain pattern for subtle texture -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.04"/>
      </feComponentTransfer>
    </filter>

    <!-- Soft vignette -->
    <radialGradient id="vignette" cx="50%" cy="0%" r="110%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.06"/>
    </radialGradient>
  </defs>

  <!-- Base background -->
  <rect width="100%" height="100%" fill="url(#g1)"/>

  <!-- Ambient color blooms -->
  <rect width="100%" height="100%" fill="url(#yGlow)"/>
  <rect width="100%" height="100%" fill="url(#bGlow)"/>
  <rect width="100%" height="100%" fill="url(#gGlow)"/>
  <rect width="100%" height="100%" fill="url(#pGlow)"/>

  <!-- Suggestive travel curves (very subtle) -->
  <g opacity="0.06" stroke="#0a0a0a" fill="none" stroke-width="2">
    <path d="M-200,120 C500,40 1200,200 2600,60"/>
    <path d="M-200,300 C600,220 1400,360 2600,240"/>
    <path d="M-200,520 C700,440 1500,580 2600,460"/>
    <path d="M-200,760 C800,680 1600,820 2600,700"/>
  </g>

  <!-- Grain texture -->
  <rect width="100%" height="100%" filter="url(#grain)"/>

  <!-- Vignette -->
  <rect width="100%" height="100%" fill="url(#vignette)"/>
</svg>
