<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft gradient background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FBFBFD"/>
    </linearGradient>

    <!-- Accent blooms -->
    <radialGradient id="bloomYellow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 60) rotate(0) scale(800 480)">
      <stop offset="0%" stop-color="#FFD600" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#FFD600" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1680 -40) rotate(0) scale(900 540)">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomPink" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 -120) rotate(0) scale(700 420)">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomGreen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 -120) rotate(0) scale(500 320)">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>

    <!-- Gentle topography strokes -->
    <pattern id="topo" x="0" y="0" width="320" height="320" patternUnits="userSpaceOnUse">
      <path d="M0,40 C80,20 240,60 320,40 M0,120 C100,100 220,140 320,120 M0,200 C120,180 200,220 320,200 M0,280 C80,260 240,300 320,280"
            stroke="#0A0A0A" stroke-opacity="0.04" stroke-width="1.2" fill="none"/>
    </pattern>

    <!-- Abstract globe (longitudes/latitudes) -->
    <g id="globe" opacity="0.08">
      <circle cx="0" cy="0" r="140" fill="none" stroke="#0A0A0A" stroke-opacity="0.16" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="110" fill="none" stroke="#0A0A0A" stroke-opacity="0.14" stroke-width="0.7"/>
      <circle cx="0" cy="0" r="80" fill="none" stroke="#0A0A0A" stroke-opacity="0.12" stroke-width="0.7"/>
      <!-- longitudes -->
      <path d="M0,-140 C40,-120 40,120 0,140 C-40,120 -40,-120 0,-140Z" fill="none" stroke="#0A0A0A" stroke-opacity="0.12" stroke-width="0.7"/>
      <path d="M-60,-140 C-20,-120 -20,120 -60,140" fill="none" stroke="#0A0A0A" stroke-opacity="0.10" stroke-width="0.7"/>
      <path d="M60,-140 C20,-120 20,120 60,140" fill="none" stroke="#0A0A0A" stroke-opacity="0.10" stroke-width="0.7"/>
      <!-- latitudes -->
      <ellipse cx="0" cy="-70" rx="120" ry="20" fill="none" stroke="#0A0A0A" stroke-opacity="0.10" stroke-width="0.7"/>
      <ellipse cx="0" cy="0" rx="130" ry="28" fill="none" stroke="#0A0A0A" stroke-opacity="0.10" stroke-width="0.7"/>
      <ellipse cx="0" cy="70" rx="120" ry="20" fill="none" stroke="#0A0A0A" stroke-opacity="0.10" stroke-width="0.7"/>
    </g>

    <!-- Paper plane -->
    <g id="paperPlane" opacity="0.10">
      <path d="M0 0 L40 12 L8 8 L0 0 Z" fill="#0A0A0A"/>
      <path d="M8 8 L14 26" stroke="#0A0A0A" stroke-opacity="0.9" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Soft cloud shape -->
    <filter id="blur1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <g id="cloud" opacity="0.14" filter="url(#blur1)">
      <path d="M140 40c0-22-18-40-40-40-14 0-26 7-33 18C61 11 48 4 34 4 15 4 0 19 0 38c0 16 12 30 27 33 2 18 18 31 36 31h64c22 0 40-18 40-40 0-22-18-40-40-40h-3z"
            fill="#0A0A0A" fill-opacity="0.18"/>
    </g>
  </defs>

  <!-- Background base -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Accent blooms -->
  <rect width="1920" height="1080" fill="url(#bloomYellow)"/>
  <rect width="1920" height="1080" fill="url(#bloomBlue)"/>
  <rect width="1920" height="1080" fill="url(#bloomPink)"/>
  <rect width="1920" height="1080" fill="url(#bloomGreen)"/>

  <!-- Topography pattern overlay -->
  <rect width="1920" height="1080" fill="url(#topo)" style="mix-blend-mode:multiply" opacity="0.7"/>

  <!-- Decorative elements (subtle, not distracting) -->
  <g>
    <!-- Globes placed sparsely -->
    <g transform="translate(360,220) scale(1)"><use href="#globe"/></g>
    <g transform="translate(1520,240) scale(0.9)"><use href="#globe"/></g>
    <g transform="translate(980,160) scale(0.7)"><use href="#globe"/></g>

    <!-- Paper planes with trails -->
    <g opacity="0.12">
      <path d="M260,420 C360,380 460,460 560,420" stroke="#0A0A0A" stroke-opacity="0.16" stroke-width="2" fill="none" stroke-dasharray="6 10" stroke-linecap="round"/>
      <g transform="translate(560,420) rotate(8)"><use href="#paperPlane"/></g>
    </g>
    <g opacity="0.12">
      <path d="M1320,620 C1420,560 1560,640 1680,600" stroke="#0A0A0A" stroke-opacity="0.16" stroke-width="2" fill="none" stroke-dasharray="6 10" stroke-linecap="round"/>
      <g transform="translate(1680,600) rotate(-12)"><use href="#paperPlane"/></g>
    </g>

    <!-- Clouds -->
    <g transform="translate(220,160) scale(1.1)"><use href="#cloud"/></g>
    <g transform="translate(1460,120) scale(1)"><use href="#cloud"/></g>
    <g transform="translate(880,40) scale(0.9)"><use href="#cloud"/></g>
  </g>

  <!-- Gentle vignette to keep center bright -->
  <radialGradient id="vignette" cx="50%" cy="0%" r="90%">
    <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0.06"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vignette)"/>

  <!-- Bottom subtle gradient to ground the page -->
  <linearGradient id="bottomSoft" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0.04"/>
  </linearGradient>
  <rect y="540" width="1920" height="540" fill="url(#bottomSoft)"/>
</svg>
